[workspace]
resolver = "2"
members = ["contracts/lumen_vault", "contracts/lumen_vault_factory"]

[workspace.dependencies]
soroban-sdk = "27.0.5"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
