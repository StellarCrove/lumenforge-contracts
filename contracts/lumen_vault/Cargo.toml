[package]
name = "lumen-vault"
version = "0.3.1"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/StellarCrove/lumenforge-contracts"
description = "Owner-gated deposit/withdraw vault Soroban contract"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
