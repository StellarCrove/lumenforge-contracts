[package]
name = "lumen-vault-factory"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/StellarCrove/lumenforge-contracts"
description = "Permissionless factory for deploying and indexing lumen_vault instances"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lumen-vault = { path = "../lumen_vault", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
